slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    resolution: 0.05
    transform_publish_period: 0.05
    map_update_interval: 2.0
    use_sim_time: true
    # Offline replay can deliver scans between recorded odom TF samples.
    # Wait for the next sample instead of dropping the scan immediately.
    transform_timeout: 1.0
    tf_buffer_duration: 30.0
    scan_buffer_size: 50
    scan_queue_size: 50
    min_laser_range: 0.2
    max_laser_range: 20.0
    use_scan_matching: true
