rtabmap:
  ros__parameters:
    map_cleanup: false
    map_always_update: true
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_stereo: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_odom_info: false
    frame_id: base_link
    map_frame_id: map
    odom_frame_id: ""
    publish_tf: true
    approx_sync: true
    topic_queue_size: 20
    sync_queue_size: 20
    qos_scan: 2
    qos_odom: 1
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"
    RGBD/CreateOccupancyGrid: "true"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    # ICP-only proximity needs a non-null initial transform. Without this,
    # RTAB-Map tries visual registration to create a guess and warns because
    # scan-cloud mode intentionally has no visual features.
    RGBD/ProximityOdomGuess: "true"
    RGBD/ProximityAngle: "180"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "2"
    Rtabmap/DetectionRate: "5.0"
    # Pure scan-cloud mode has no visual words. A threshold of 0 accepts every
    # appearance hypothesis; 1 disables those hypotheses while retaining
    # RGBD/ProximityBySpace for ICP loop closures.
    Rtabmap/LoopThr: "1.0"
    RGBD/AggressiveLoopThr: "1.0"
    Reg/Strategy: "1"
    Icp/MaxCorrespondenceDistance: "0.2"
    Icp/MaxTranslation: "0.5"
    Icp/MaxRotation: "1.57"
    Grid/FromDepth: "false"
    Grid/3D: "true"
    Grid/RayTracing: "true"
    Grid/CellSize: "0.05"
