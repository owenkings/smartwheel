# FAST-LIO2 config for the single LEFT XT-M60 flash-ToF radar (spec:
# fastlio-narrow-fov-mapping, Task 5). Consumed by fast_lio (Ericsii/FAST_LIO_ROS2,
# commit 2fffc57). The node reads parameters under /**:ros__parameters.
#
# XT-M60 is a whole-frame flash ToF: standard sensor_msgs/PointCloud2 XYZI, NO
# per-point time, NO ring, ~10 Hz, narrow 120x90 FOV. It is fed via the
# lio_cloud_adapter_node on /lio/cloud_in (Task 3), NOT a Livox/Velodyne driver.
#
# DESKEW OFF: lidar_type=5 selects FAST-LIO's generic PointCloud2 path. XT-M60
# flash frames have no per-point time or ring; the adapter forwards XYZI without
# synthesizing either field. time_sync_en=false.
/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1            # keep all points (XT-M60 is already sparse vs a 32-line spinner)
        max_iteration: 3
        filter_size_surf: 0.2          # indoor scale (tune in Task 7)
        filter_size_map: 0.3           # indoor scale (tune in Task 7)
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./xtm60_left_lio_map.pcd"

        common:
            lid_topic: "/lio/cloud_in"   # output of lio_cloud_adapter_node (Task 3)
            imu_topic: "/imu/data"       # H30 (~200 Hz measured, not 100)
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 5                # 5 = generic PointCloud2 XYZI path (NOT Velodyne/Livox)
            scan_line: 90                # XT-M60 organized-cloud vertical lines (approx; refined in Task 7)
            scan_rate: 10                # Hz
            timestamp_unit: 0            # unused by generic whole-frame XYZI path
            blind: 0.1                   # near-clip (m); XT-M60 near surface/noise

        mapping:
            # Use the same statistically sane baseline and fail-closed update
            # guards as the current right route. Do not revive the historical
            # R=100 / frozen gyro-bias tuning on this dormant left route.
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            laser_point_cov: 0.001
            update_guard:
                enabled: true
                min_effective_features: 50
                max_mean_residual_m: 0.25
                min_observability_ratio: 0.000001
                min_observable_directions: 3
                project_degenerate_directions: true
                reject_after_lidar_gap_sec: 0.5
                max_position_correction_m: 0.05
                max_rotation_correction_deg: 2.0
                max_velocity_correction_mps: 0.5
                adaptive_retry_enabled: true
                adaptive_retry_max: 3
                adaptive_retry_covariance_scale: 4.0
            fov_degree: 120.0            # XT-M60 horizontal FOV ~120 deg (narrow; NOT 360)
            det_range: 20.0              # XT-M60 effective indoor range (m)
            extrinsic_est_en: false      # extrinsic is known/derived; do NOT online-estimate
            # LiDAR pose in IMU body frame: T_il = inv(base->imu) @ base->lidar.
            # [Task 15 ground-calib, RECALIBRATED] Calibrated from the STATIONARY
            # floor-visible bag (auto_test/20260622_ground_calib_bag) by RANSAC-
            # fitting the floor PLANE (refined on inliers via SVD), NOT a brute-force
            # median search over a mixed band. See recalibrate.py.
            #   floor normal (sensor z-fwd/y-up/x-left): [0.0136, 0.9997, 0.0193]
            #   mount height = |d| = 0.545 m ; mount pitch = +1.10 deg ; roll = +0.78 deg
            #   floor->base_link z on plane inliers: median -0.0001 m, std 0.008 m (flat).
            # (The previous 12.5deg pitch / 0.53m came from a broken objective that
            #  minimised median+std over a band that was only ~21% floor.)
            # base->imu=[0,0,0.45]; base->lidar=[0.45,0.24,0.545] (quat in launch TF).
            extrinsic_T: [ 0.450000, 0.240000, 0.095437 ]
            extrinsic_R: [ -0.000135, -0.019278, 0.999814,
                            0.999907, -0.013615, -0.000128,
                            0.013615, 0.999721, 0.019278 ]

        publish:
            map_en: false                # do not publish unbounded /Laser_map
            path_en: true                # publish /path for RViz trajectory (req 4 / Task 10)
            path_stride: 10
            path_max_poses: 600
            scan_publish_en: true        # publish registered cloud
            dense_publish_en: true
            scan_bodyframe_pub_en: false

        imu_init:
            min_samples: 400
            min_duration_sec: 2.0
            max_gyro_norm_rps: 0.10
            max_accel_deviation_mps2: 1.0
            max_gyro_std_rps: 0.05
            max_accel_std_mps2: 0.50

        pcd_save:
            # OFF: with interval < 0 laserMapping.cpp:536 never flushes, so the cloud
            # accumulates in RAM for the whole session. Saving is done out-of-process
            # by scripts/lio_save_cloud.py (/cloud_registered), which is decoupled
            # from this flag.
            pcd_save_en: false
            interval: -1                 # all frames in ONE pcd (unused while disabled)
