dual_lidar_cloud_fusion_node:
  ros__parameters:
    # XT-M60 left/right point cloud inputs and the frame to merge them into.
    left_points_topic: /xtm60/left/points
    right_points_topic: /xtm60/right/points
    target_frame: base_link
    output_topic: /points_merged
    status_topic: /points_merged/status

    # Radial range filter (sensor frame), then height filter (target frame).
    # XT-M60 trustworthy band is ~0.3-15 m; keep the full 0.3-15 m so far walls
    # are not clipped (only the blind-zone < 0.3 m is dropped).
    min_range: 0.3
    max_range: 15.0
    # Height crop in base_link for the MAPPING cloud. Widened so the mapping cloud
    # keeps nearly all of what amp_view shows (only extreme floor/ceiling sweep is
    # cut). Floor itself is still classified by rtabmap grid ground segmentation.
    z_min: -0.50
    z_max: 2.50

    # 0.0 disables voxel downsampling -> mapping cloud keeps full sensor
    # resolution, matching the dense amp_view look (no thinning).
    voxel_leaf_size: 0.0

    # If only one lidar is fresh, keep publishing from it instead of stopping.
    allow_single_lidar_fallback: true
    publish_diagnostics: true

    output_rate_hz: 10.0
    input_timeout_sec: 0.5
    tf_timeout_sec: 0.1
