dual_lidar_cloud_fusion_node:
  ros__parameters:
    # XT-M60 left/right point cloud inputs and the frame to merge them into.
    left_points_topic: /xtm60/left/points
    right_points_topic: /xtm60/right/points
    target_frame: base_link
    output_topic: /points_merged
    status_topic: /points_merged/status

    # Radial range filter (sensor frame), then height filter (target frame).
    # XT-M60 trustworthy band is ~0.3-15 m; use 0.3-12 m to drop the blind-zone
    # noise and unreliable far/flying points.
    min_range: 0.3
    max_range: 12.0
    # Height crop in base_link for the MAPPING cloud. The XT-M60 is a wide-FOV
    # flash camera (~60 deg vertical): mounted at ~0.65 m it sees a lot of FLOOR
    # (downward rays) and CEILING (upward rays). Keep a band around chair/obstacle
    # height so the 3D map and grid are built from walls/objects, not floor and
    # ceiling sweep. Floor itself is still handled by the grid ground segmentation
    # in rtabmap. z_min slightly below 0 keeps the true floor line for ray-tracing
    # free space; z_max cuts the ceiling. (Display topic /xtm60/* is NOT cropped.)
    z_min: -0.10
    z_max: 1.80

    # 0.0 disables voxel downsampling. Raise to thin dense clouds before LIVO.
    voxel_leaf_size: 0.05

    # If only one lidar is fresh, keep publishing from it instead of stopping.
    allow_single_lidar_fallback: true
    publish_diagnostics: true

    output_rate_hz: 10.0
    input_timeout_sec: 0.5
    tf_timeout_sec: 0.1
