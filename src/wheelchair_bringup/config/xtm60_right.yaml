xtm60_right_adapter_node:
  ros__parameters:
    sdk_root: "/home/nvidia/smartwheel/xtsdk_py"
    connection_mode: ethernet
    ip_address: "192.168.1.101"
    serial_port: ""
    image_type: 4
    frame_id: xtm60_right_link
    # This is the host polling timer, not a forced output rate. Poll at 20 Hz
    # so the latest-frame buffer does not regularly miss the 10 Hz SDK stream.
    publish_rate_hz: 20.0
    use_sdk_timestamps: false
    # Stamp in the vendor callback at host receipt, before the 20 Hz ROS publish
    # timer. SDK uptime stamps are retained for diagnostics but are not guessed
    # into the ROS epoch until the vendor/reset semantics are verified.
    timestamp_source: host_receive

    point_unit_scale: 1.0
    # Match the XT-Toffuture upper-computer M60 default "PointCloud+Amp" view:
    # Min Show Distance = 0 cm, Max Show Distance = 5000 cm (no practical cutoff).
    # Vendor invalid-amplitude pixels (>=64000) are published as NaN rather
    # than false obstacles. Mapping re-filters /points_merged to 0.3-12 m.
    range_min: 0.0
    range_max: 50.0
    publish_intensity: true
    # Organized cloud (grid, NaN for invalid) -> dense, surface-like RViz view.
    organized_cloud: true

    # SDK device-side filters matched to the upper-computer M60 defaults
    # (dev_scene.ini [M60.Scene1.Filters]); same as the left radar.
    # Use the same host-SDK processing policy for both radars. Raw ImageType(4)
    # frames were geometrically plausible on both units in the 2026-07-28 A/B
    # check; the optional filter chain corrupted the left stream. Leave it off
    # until the individual offending filter is isolated with bounded tests.
    enable_sdk_filters: false
    kalman_factor: 300
    kalman_threshold: 300
    kalman_range: 2000
    median_size: 3
    edge_threshold: 150
    dust_enable: true
    dust_threshold: 9000
    dust_frames: 2
    postprocess_enable: true
    postprocess_threshold: 5.0
    postprocess_dynamic_enable: 1
    postprocess_dynamic_winsize: 9
    reflective_enable: true
    reflective_th_min: 0.5
    reflective_th_max: 2.0

    # Optional device-side imaging parameters. On 2026-07-28 the user selected
    # the right unit's persistent int_time_3=30 as the source for both units.
    # Routine startup remains read-only because the configuration is now stored;
    # set this true only for another approved, documented configuration operation.
    apply_device_config: false
    # Read-only startup guard: never publish from the wrong unit or silently
    # continue after the stored imaging parameters drift.
    verify_device_config: true
    require_device_config_match: true
    expected_serial: "XTM60B20250324000134"
    int_time_gs: 2000
    int_time_1: 1600
    int_time_2: 200
    int_time_3: 30
    int_time_4: 1600
    hdr_mode: 1
    min_amplitude: 70
    max_fps: 10
    mod_freq1: 0
    mod_freq2: 0
    mod_freq3: 0
    mod_freq4: 3
    mod_freq5: 2

    reconnect_interval_sec: 3.0
    require_ping_before_start: true
    frame_timeout_sec: 8.0
    # Single-radar-safe default: never stop/start a healthy stream periodically.
    # A dual-radar launch may explicitly override this to 30 s together with the
    # left/right phase offsets; direct adapter and single-right routes stay at 0.
    phase_mode: grid
    phase_period_sec: 0.1
    phase_offset_sec: 0.05
    phase_realign_interval_sec: 0.0
    # Accepted frames remain on /points; rejected frames are diverted to
    # /points_rejected and summarized on /quality. Thresholds are shared with
    # the left unit and must pass the 30-minute dual-radar soak.
    quality_gate_enabled: true
    # Absolute valid-pixel floor. Measured 20260903 on this unit
    # (XTM60B20250324000134, right-only deployment, indoor room): valid_fraction
    # sits at 0.712-0.714 with a healthy stream (frame-to-frame median range
    # delta 16 mm, p95 ~80 mm, overlap 0.71, 64.0 C / VCSEL 59.7 C). The previous
    # 0.75 came from the dual-radar soak profile and was never validated against
    # this unit alone, so it rejected 100% of frames: accepted=0, dropped=195+,
    # reason=absolute_valid_fraction, every cloud diverted to
    # /xtm60/points_rejected and /xtm60/right/points permanently silent -> no
    # FAST-LIO input, no 3D map, no 2D grid.
    # 0.65 keeps a real floor (~7 pp of headroom below the measured level, still
    # well above a genuinely blinded/occluded sensor) while letting a healthy
    # flash-ToF frame through: ~29% NaN is normal indoors, where far walls, dark
    # surfaces and glass return no signal. Raise this again once a documented
    # per-unit soak establishes the achievable level.
    # Evidence: auto_test/20260903_173000_right_diag_route/radar_probe.txt
    quality_min_valid_fraction: 0.65
    quality_min_relative_valid_fraction: 0.75
    quality_baseline_window_frames: 30
    quality_max_median_range_delta: 0.10
    quality_max_p95_range_delta: 0.75
    quality_min_overlap_fraction: 0.20
    quality_reset_after_gap_sec: 0.50
    # Static profiles reject same-ray temporal jumps. The driving/LIO route
    # overrides this false because ego-motion legitimately changes those rays;
    # the absolute/relative validity gates remain hard in either mode.
    quality_temporal_hard_reject: true
    # The SDK binds its local receive socket to 7687. The launch shim pins that
    # socket to 192.168.1.100 so it cannot consume left-radar packets. The device
    # must therefore also send to 7687 (matching the bound receive port).
    udp_dest_ip: "192.168.1.100"
    udp_dest_port: 7687
