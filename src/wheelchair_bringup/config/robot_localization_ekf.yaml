ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.1
    print_diagnostics: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel odom: trust it ONLY for translation (x/y + vx). Do NOT let it provide
    # yaw -- wheel-derived yaw (from left/right speed diff via wheel_separation)
    # is the WORST heading source: wheel slip + wheel_separation error make turns
    # wildly wrong (parallel edges map as a triangle). So yaw(abs)=false and
    # vyaw=false for the wheels.
    odom0: /wheel/odom
    odom0_config: [true, true, false,
                   false, false, false,
                   true, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU (H30, YIS106): attitude-grade yaw. Make it the PRIMARY heading source.
    # The H30 is physically aligned to the chassis now, so use its yaw. We fuse
    # absolute yaw (relative: true zeroes the AHRS reference at startup so the
    # ~173 deg sensor-frame offset is removed) PLUS yaw rate (vyaw). This is the
    # "let H30 drive heading" design -- wheels give distance, IMU gives angle.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
