xtm60_left_adapter_node:
  ros__parameters:
    sdk_root: "/home/nvidia/smartwheel/xtsdk_py"
    connection_mode: ethernet
    ip_address: "192.168.0.101"
    serial_port: ""
    image_type: 4
    frame_id: xtm60_left_link
    publish_rate_hz: 10.0
    use_sdk_timestamps: false

    point_unit_scale: 1.0
    # Match the XT-Toffuture upper-computer M60 default "PointCloud+Amp" view:
    # Min Show Distance = 0 cm, Max Show Distance = 5000 cm (no practical cutoff).
    # The raw /xtm60/left/points topic is therefore shown UNFILTERED, exactly
    # like the upper-computer. Mapping is unaffected: dual_lidar_cloud_fusion_node
    # re-applies the trustworthy 0.3-12 m band on /points_merged for RTAB-Map.
    range_min: 0.0
    range_max: 50.0
    publish_intensity: true
    # Publish an ORGANIZED cloud (height=sensor rows, width=cols, invalid pixels
    # = NaN) instead of a shuffled flat list. Keeps neighbour pixels adjacent so
    # RViz renders a dense, surface-like view (like the upper-computer) instead
    # of scattered "confetti". The fusion node tolerates NaNs (range filter drops
    # them) so mapping is unaffected.
    organized_cloud: true

    # SDK device-side filters matched to dev_scene.ini [M60.Scene1.Filters]:
    #   medianSize=3, edgeThreshold=150, kalmanFactor=0.30 (=300/1000),
    #   kalmanThreshold=300.
    enable_sdk_filters: true
    kalman_factor: 300
    kalman_threshold: 300
    kalman_range: 2000
    median_size: 3
    edge_threshold: 150
    # Extra SDK filters matched to dev_scene.ini [M60.Scene1.Filters] so the ROS
    # cloud gets the same cleanup the upper-computer does (dust / postprocess /
    # reflective). Set the *_enable flags false to turn any off.
    dust_enable: true
    dust_threshold: 9000          # dustThreshold
    dust_frames: 2                # dustFrames
    postprocess_enable: true
    postprocess_threshold: 5.0    # postprocessThreshold (near-range optimize)
    postprocess_dynamic_enable: 1 # dynamicsEnabled (moving-object handling)
    postprocess_dynamic_winsize: 9 # dynamicsWinsize
    reflective_enable: true
    reflective_th_min: 0.5        # ref_th_min (multipath / strong-reflection)
    reflective_th_max: 2.0        # ref_th_max
    # --- Device-side IMAGING params, pushed to the radar on connect, mirroring
    #     the upper-computer "Config Device" flow and xtsdk_py/xintan.xtcfg.
    #     Previously the adapter left these at the radar's power-on defaults, so
    #     ROS clouds were dimmer/sparser than the tuned upper-computer view.
    #     Values copied from the exported xintan.xtcfg:
    #       intgs=2000 int1=1600 int2=200 int3=30 int4=1600
    #       HDR=1 minLSB=70 maxfps=10 freq4=3 freq5=3
    #     Set apply_device_config:false to keep the device's stored settings. ---
    apply_device_config: true
    int_time_gs: 2000
    int_time_1: 1600
    int_time_2: 200
    int_time_3: 30
    int_time_4: 1600
    hdr_mode: 1
    min_amplitude: 70
    max_fps: 10
    mod_freq1: 0
    mod_freq2: 0
    mod_freq3: 0
    mod_freq4: 3
    mod_freq5: 2
    reconnect_interval_sec: 3.0
    require_ping_before_start: true
    frame_timeout_sec: 8.0
    # The vendor SDK locally listens on UDP 7687. sensors.launch.py pins each
    # process to the host IP on its radar subnet with libxt_bindshim.so.
    udp_dest_ip: "192.168.0.100"
    udp_dest_port: 7687
