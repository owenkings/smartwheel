xtm60_left_adapter_node:
  ros__parameters:
    sdk_root: "/home/nvidia/smartwheel/xtsdk_py"
    connection_mode: ethernet
    ip_address: "192.168.0.101"
    serial_port: ""
    image_type: 4
    frame_id: xtm60_left_link
    # This is the host polling timer, not a forced output rate. Poll at 20 Hz
    # so the latest-frame buffer does not regularly miss the 10 Hz SDK stream.
    publish_rate_hz: 20.0
    use_sdk_timestamps: false
    timestamp_source: host_receive

    point_unit_scale: 1.0
    # Match the XT-Toffuture upper-computer M60 default "PointCloud+Amp" view:
    # Min Show Distance = 0 cm, Max Show Distance = 5000 cm (no practical cutoff).
    # The raw /xtm60/left/points topic therefore has no additional range cutoff.
    # Vendor invalid-amplitude pixels (>=64000) are still published as NaN rather
    # than false obstacles. Mapping is unaffected: dual_lidar_cloud_fusion_node
    # re-applies the trustworthy 0.3-12 m band on /points_merged for RTAB-Map.
    range_min: 0.0
    range_max: 50.0
    publish_intensity: true
    # Publish an ORGANIZED cloud (height=sensor rows, width=cols, invalid pixels
    # = NaN) instead of a shuffled flat list. Keeps neighbour pixels adjacent so
    # RViz renders a dense, surface-like view (like the upper-computer) instead
    # of scattered "confetti". The fusion node tolerates NaNs (range filter drops
    # them) so mapping is unaffected.
    organized_cloud: true

    # SDK device-side filters matched to dev_scene.ini [M60.Scene1.Filters]:
    #   medianSize=3, edgeThreshold=150, kalmanFactor=0.30 (=300/1000),
    #   kalmanThreshold=300.
    # Keep the optional SDK-side filter chain disabled in production until its
    # per-device behaviour is understood. A 2026-07-28 A/B check found that
    # ImageType(4) raw frames from this unit had a plausible 1.278 m median,
    # while the same stream with the extra filter chain enabled was displaced
    # to a 36.356 m median and disappeared from the near-field RViz view.
    # This does not change the device's saved imaging configuration.
    enable_sdk_filters: false
    kalman_factor: 300
    kalman_threshold: 300
    kalman_range: 2000
    median_size: 3
    edge_threshold: 150
    # Extra SDK filters matched to dev_scene.ini [M60.Scene1.Filters] so the ROS
    # cloud gets the same cleanup the upper-computer does (dust / postprocess /
    # reflective). Set the *_enable flags false to turn any off.
    dust_enable: true
    dust_threshold: 9000          # dustThreshold
    dust_frames: 2                # dustFrames
    postprocess_enable: true
    postprocess_threshold: 5.0    # postprocessThreshold (near-range optimize)
    postprocess_dynamic_enable: 1 # dynamicsEnabled (moving-object handling)
    postprocess_dynamic_winsize: 9 # dynamicsWinsize
    reflective_enable: true
    reflective_th_min: 0.5        # ref_th_min (multipath / strong-reflection)
    reflective_th_max: 2.0        # ref_th_max
    # --- Optional device-side IMAGING params, mirroring the upper-computer
    #     "Config Device" flow and xtsdk_py/xintan.xtcfg.
    #     The 2026-07-28 user-authorized right-to-left mirror established the
    #     current production exposure set:
    #       intgs=2000 int1=1600 int2=200 int3=30 int4=1600
    #     This intentionally supersedes the older Windows export's int3=20.
    #       HDR=1 minLSB=70 maxfps=10 freq1..4=0,0,0,3
    #     Official SDK examples pass enum 2 as the fifth setMultiModFreq argument;
    #     their config path does not consume the export's freq5 key.
    #     B1 verified the stored device values and intentionally ran with this
    #     false. Change to true only for an explicit, documented configuration
    #     operation; normal bring-up must not rewrite the radar automatically. ---
    apply_device_config: false
    # Read-only startup guard: never publish from the wrong unit or silently
    # continue after the stored imaging parameters drift.
    verify_device_config: true
    require_device_config_match: true
    expected_serial: "XTM60B20250324000151"
    int_time_gs: 2000
    int_time_1: 1600
    int_time_2: 200
    int_time_3: 30
    int_time_4: 1600
    hdr_mode: 1
    min_amplitude: 70
    max_fps: 10
    mod_freq1: 0
    mod_freq2: 0
    mod_freq3: 0
    mod_freq4: 3
    mod_freq5: 2
    reconnect_interval_sec: 3.0
    require_ping_before_start: true
    frame_timeout_sec: 8.0
    # Host-side optical-interference mitigation: align sdk.start() to a common
    # 100 ms host-monotonic grid. The left flash starts at offset 0 and the
    # right starts 50 ms later, matching the measured low-interference order.
    # Single-radar-safe default. Dual-radar orchestration explicitly opts into
    # periodic phase realignment for both units as one coordinated profile.
    phase_mode: grid
    phase_period_sec: 0.1
    phase_offset_sec: 0.0
    phase_realign_interval_sec: 0.0
    # /xtm60/left/points carries accepted production frames. Transient frames
    # with implausible whole-frame range jumps, severe validity loss, or
    # non-monotonic receive time are diverted to /points_rejected; compact
    # per-frame metrics remain available on /quality.
    quality_gate_enabled: true
    # Formal mapping must not learn the left unit's current 46-60% degraded
    # state as a valid baseline. Frames below 75% are quarantined.
    quality_min_valid_fraction: 0.75
    quality_min_relative_valid_fraction: 0.75
    quality_baseline_window_frames: 30
    quality_max_median_range_delta: 0.10
    quality_max_p95_range_delta: 0.75
    quality_min_overlap_fraction: 0.20
    quality_reset_after_gap_sec: 0.50
    quality_temporal_hard_reject: true
    # The vendor SDK locally listens on UDP 7687. sensors.launch.py pins each
    # process to the host IP on its radar subnet with libxt_bindshim.so.
    udp_dest_ip: "192.168.0.100"
    udp_dest_port: 7687
