safety_supervisor_node:
  ros__parameters:
    cmd_vel_nav_topic: /cmd_vel_nav
    cmd_vel_safe_topic: /cmd_vel_safe
    scan_topic: /scan
    safety_state_topic: /safety_state
    emergency_stop_hw_topic: /emergency_stop_hw
    emergency_stop_sw_topic: /emergency_stop_sw

    # ============================================================
    # MANUAL-MAPPING PROFILE  (HUMAN-SUPERVISED TELEOP ONLY)
    # ============================================================
    # manual_bypass=true makes the safety supervisor SKIP all obstacle/distance
    # gating (LiDAR scan stop/slowdown, ultrasonic stop/rotation, scan-stale
    # SENSOR_FAULT, diagnostic system-stop, localization/passability faults).
    # The operator watches and decides what is safe, so the chair:
    #   - drives forward/back freely (no auto-stop on nearby obstacles)
    #   - turns freely, including while moving (arc turns)
    #   - is not stopped when the LiDAR briefly drops out
    # STILL ENFORCED: software E-stop (/emergency_stop_sw), hardware E-stop
    # (/emergency_stop_hw), command timeout (zeroes if teleop stops publishing),
    # and the speed clamps below. NEVER use this profile for autonomous driving
    # or passenger operation -- use safety_params.yaml for those.
    manual_bypass: true

    max_auto_speed: 0.25
    hard_max_speed: 0.5
    max_angular_speed: 0.6
    allow_reverse_motion: true
    max_reverse_speed: 0.12

    # Command timeout: if teleop stops publishing /cmd_vel_nav for this long the
    # chair is zeroed. Keep short so releasing a button stops promptly.
    cmd_timeout_sec: 0.4
    publish_rate_hz: 20.0

    require_localization_healthy: false

velocity_limiter_node:
  ros__parameters:
    input_topic: /cmd_vel_nav
    output_topic: /cmd_vel_limited
    max_linear_x: 0.25
    max_angular_z: 0.6

emergency_stop_node:
  ros__parameters:
    output_topic: /emergency_stop_sw
